[package]
name = "dozy"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
global-hotkey = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[build-dependencies]
cc = "1.11.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
