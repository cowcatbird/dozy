name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test
      - run: scripts/bundle-macos.sh --universal
      - run: ditto -c -k --keepParent target/Dozy.app Dozy-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dozy-macos
          path: Dozy-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release
      - run: Copy-Item target/release/dozy.exe Dozy-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Dozy-windows
          path: Dozy-windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Dozy-macos.zip
            Dozy-windows.exe
